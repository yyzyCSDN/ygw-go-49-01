<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArtifactRegistry 仓库浏览</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f5f7fa; color: #1f2937; }
    header { background: #1f4e78; color: #fff; padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
    header h1 { font-size: 1.15rem; margin: 0; font-weight: 600; }
    main { max-width: 960px; margin: 1.5rem auto; padding: 0 1rem; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .card h2 { margin: 0 0 .5rem; font-size: 1rem; color: #1f4e78; }
    .repo { border-top: 1px solid #eef1f5; padding: .75rem 0; }
    .repo:first-of-type { border-top: 0; }
    .repo .name { font-weight: 600; }
    .pill { display: inline-block; background: #eef4fb; color: #1f4e78; border-radius: 999px; padding: .15rem .6rem; font-size: .78rem; margin: .15rem .2rem .15rem 0; }
    .empty { color: #6b7280; font-size: .9rem; }
    #status { font-size: .85rem; margin-left: auto; color: #cfe3f7; }
    code { background: #f3f4f6; padding: .1rem .35rem; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>ArtifactRegistry</h1>
    <span id="status">连接中…</span>
  </header>
  <main>
    <div class="card">
      <h2>仓库列表</h2>
      <div id="repos"><p class="empty">加载中…</p></div>
    </div>
  </main>
  <script>
    async function load() {
      const status = document.getElementById('status');
      const box = document.getElementById('repos');
      try {
        const res = await fetch('/api/repos');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        status.textContent = data.count + ' 个仓库';
        if (!data.repositories || data.repositories.length === 0) {
          box.innerHTML = '<p class="empty">暂无仓库，通过 POST /v1/repos 创建。</p>';
          return;
        }
        box.innerHTML = data.repositories.map(function (repo) {
          const artifacts = (repo.artifacts || []).map(function (name) {
            return '<span class="pill">制品 ' + name + '</span>';
          }).join('');
          const tags = (repo.tags || []).map(function (name) {
            return '<span class="pill">tag ' + name + '</span>';
          }).join('');
          return '<div class="repo"><span class="name">' + repo.name + '</span><br>' +
            (artifacts || '<span class="empty">无制品</span>') + '<br>' +
            (tags || '<span class="empty">无 tag</span>') + '</div>';
        }).join('');
      } catch (err) {
        status.textContent = '加载失败';
        box.innerHTML = '<p class="empty">无法读取仓库列表：' + err.message + '</p>';
      }
    }
    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
